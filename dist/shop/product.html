  <main class="container pt-lg pb-xl">
    <div class="product-layout grid grid-cols-2 gap-grid-lg">
      <div class="product-gallery">
        <div id="main-image" class="bg-elevated rounded-lg h-96 flex items-center justify-center mb-md">
          <img src="/public/images/placeholder.svg" alt="สินค้า" id="main-product-img" class="max-h-full max-w-full object-contain">
        </div>
        <div id="thumbnail-list" class="flex gap-sm overflow-auto">
          <!-- Thumbnails loaded via JavaScript -->
        </div>
      </div>

        <h1 id="product-title" class="text-2xl mb-sm">ชื่อสินค้า</h1>
        <div id="product-price" class="text-xl font-bold text-primary mb-md">฿0.00</div>
        <div id="product-stock" class="mb-md"></div>

        <h3 class="text-lg mb-md">รายละเอียดสินค้า</h3>
        <div id="product-description" class="text-secondary mb-lg"></div>

        <div class="mb-lg">
          <label class="form-label">จำนวน</label>
          <div class="flex items-center gap-sm w-32">
            <button id="qty-decrease" class="btn-outline w-10 h-auto">−</button>
            <input type="number" id="qty-input" class="form-input text-center w-12" value="1" min="1">
            <button id="qty-increase" class="btn-outline w-10 h-auto">+</button>
          </div>
        </div>

        <button id="add-to-cart-btn" class="btn btn-primary btn-full mb-lg" data-add-to-cart>
          หยิบใส่ตะกร้า
        </button>

        <button id="buy-now-btn" class="btn btn-outline btn-full mb-lg">
          ซื้อเลย

          <div id="reviews-list" class="space-y-md">
            <!-- Reviews loaded via JavaScript -->
          </div>
        </div>
      </div>
    </div>

    <div id="related-products" class="mt-xl">
      <h2 class="mb-md">สินค้าที่เกี่ยวข้อง</h2>
