<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งรหัสผ่านใหม่ - ZenMarket</title>
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <script type="module" crossorigin src="/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
  <script type="module" crossorigin src="/assets/ui-CnCqiM0r.js"></script>
  <script type="module" crossorigin src="/assets/app-BhP0Ew1d.js"></script>
  <script type="module" crossorigin src="/assets/account-BB9zsw2f.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/responsive-CDetyTtb.css">
</head>
<body>
  <main class="container pt-lg pb-xl">
    <div class="auth-card card p-lg mx-auto w-full sm:w-96">
      <div class="text-center mb-xl">
        <div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center mx-auto mb-md">
          <span class="text-white font-bold text-lg">Z</span>
        </div>
        <h2>ตั้งรหัสผ่านใหม่</h2>
        <p class="text-secondary text-sm">สร้างรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>
      </div>

      <form id="reset-password-form" class="space-y-md">
        <div class="form-group">
          <label class="form-label">รหัสผ่านใหม่</label>
          <input type="password" id="reset-password" class="form-input" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">ยืนยันรหัสผ่านใหม่</label>
          <input type="password" id="reset-confirm-password" class="form-input" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-full">ตั้งรหัสผ่านใหม่</button>
      </form>

      <div class="text-center mt-lg">
        <p class="text-secondary text-sm">จำรหัสผ่านได้แล้ว?</p>
        <a href="/auth/login.html" class="btn btn-outline btn-full">เข้าสู่ระบบ</a>
      </div>
    </div>
  </main>
</body>
</html>
