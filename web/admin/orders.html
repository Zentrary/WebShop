<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำสั่งซื้อ — ZenMarket Admin</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/admin/index.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <div class="admin-layout">
    <div class="admin-content">
      <div class="admin-head">
        <div>
          <span class="eyebrow">Orders</span>
          <h1 style="font-size:var(--font-size-2xl)">คำสั่งซื้อ</h1>
        </div>
      </div>

      <div class="flex gap-sm mb-lg" style="flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" data-status="all">ทั้งหมด</button>
        <button class="btn btn-outline btn-sm" data-status="pending">รอยืนยัน</button>
        <button class="btn btn-outline btn-sm" data-status="review">รอตรวจสอบสลิป</button>
        <button class="btn btn-outline btn-sm" data-status="paid">ชำระแล้ว</button>
        <button class="btn btn-outline btn-sm" data-status="shipped">จัดส่งแล้ว</button>
        <button class="btn btn-outline btn-sm" data-status="delivered">ส่งถึงแล้ว</button>
        <button class="btn btn-outline btn-sm" data-status="cancelled">ยกเลิก</button>
      </div>

      <div class="table-wrap reveal">
        <table class="data">
          <thead>
            <tr>
              <th>เลขที่</th>
              <th>ผู้รับ</th>
              <th>วันที่</th>
              <th class="num">ยอดรวม</th>
              <th>สถานะ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="admin-orders-list"></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
