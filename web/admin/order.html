<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จัดการคำสั่งซื้อ — ZenMarket Admin</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/admin/index.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <div class="admin-layout">
    <div class="admin-content">
      <div id="admin-order-detail" class="hidden">
        <div class="admin-head">
          <div>
            <span class="eyebrow">Order</span>
            <h1 style="font-size:var(--font-size-2xl)">คำสั่งซื้อ <span id="admin-order-number" class="text-accent"></span></h1>
            <p class="text-muted text-sm mt-sm">วันที่สั่งซื้อ <span id="admin-order-date"></span></p>
          </div>
          <a href="/admin/orders.html" class="btn btn-ghost">← กลับรายการ</a>
        </div>

        <div class="cart-grid">
          <div class="flex flex-col gap-lg">
            <div class="panel reveal">
              <h2>สินค้าที่สั่งซื้อ</h2>
              <div id="admin-order-items"></div>
            </div>

            <div class="panel reveal" data-delay="1">
              <h2>สลิปการชำระเงิน</h2>
              <div id="admin-order-receipt"><p class="text-muted text-sm">ไม่พบสลิป</p></div>
            </div>
          </div>

          <aside class="summary reveal" data-delay="1">
            <h2>ข้อมูลคำสั่งซื้อ</h2>
            <div class="sum-row"><span>ผู้รับ</span><span id="admin-order-customer">-</span></div>
            <div class="sum-row"><span>วิธีชำระเงิน</span><span id="admin-order-payment">-</span></div>
            <div class="sum-row"><span>ที่อยู่</span></div>
            <p class="text-sm" id="admin-order-address">-</p>
            <div class="sum-row"><span>ยอดรวมสินค้า</span><span id="admin-order-subtotal">฿0.00</span></div>
            <div class="sum-row"><span>ค่าจัดส่ง</span><span id="admin-order-shipping">฿0.00</span></div>
            <div class="sum-row total"><span>รวมทั้งหมด</span><span id="admin-order-total">฿0.00</span></div>

            <hr class="divider">

            <div class="form-group">
              <label class="form-label" for="admin-order-status">สถานะคำสั่งซื้อ</label>
              <select id="admin-order-status" class="form-select">
                <option value="pending">รอยืนยัน</option>
                <option value="review">รอตรวจสอบสลิป</option>
                <option value="paid">ชำระเงินแล้ว</option>
                <option value="shipped">จัดส่งแล้ว</option>
                <option value="delivered">ส่งถึงมือแล้ว</option>
                <option value="cancelled">ยกเลิกแล้ว</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="admin-tracking-number">เลขพัสดุ / รหัสพัสดุ</label>
              <input type="text" id="admin-tracking-number" class="form-input" placeholder="TH1234567890">
            </div>

            <button id="admin-update-order-btn" class="btn btn-primary btn-full">อัปเดตคำสั่งซื้อ</button>
          </aside>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
