<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การดำเนินงาน — ZenMarket Admin</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/admin/operations.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <div class="admin-layout">
    <div class="admin-content">
      <div class="admin-head">
        <div>
          <span class="eyebrow">Operations</span>
          <h1 style="font-size:var(--font-size-2xl)">การดำเนินงาน</h1>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-lg)" class="admin-two-col">
        <div class="panel reveal">
          <h2>สำรองและกู้คืนข้อมูล</h2>
          <p class="text-sm mb-md">ดาวน์โหลดข้อมูลร้านทั้งหมด (สินค้า คำสั่งซื้อ รีวิว) เข้ารหัสด้วยรหัสผ่านของคุณ</p>
          <div class="form-group">
            <label class="form-label" for="backup-password">รหัสผ่านสำหรับเข้ารหัส</label>
            <input type="password" id="backup-password" class="form-input" placeholder="••••••••">
          </div>
          <div class="flex gap-sm" style="flex-wrap:wrap">
            <button id="backup-download-btn" class="btn btn-primary">ดาวน์โหลดข้อมูล</button>
            <button id="backup-upload-btn" class="btn btn-outline">กู้คืนจากไฟล์</button>
          </div>
          <input type="file" id="backup-file-input" accept=".zenbackup,application/json" class="hidden">
          <div id="operations-error-log" class="mt-lg"></div>
        </div>

        <div class="panel reveal" data-delay="1">
          <h2>สถานะระบบ</h2>
          <div id="operations-notifications"></div>
          <hr class="divider">
          <h2 style="font-size:var(--font-size-base)">สถานะการคืนสต็อก</h2>
          <div id="operations-restock-status"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
