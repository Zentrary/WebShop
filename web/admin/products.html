<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenMarket | สินค้า</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/admin/index.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <div class="admin-layout">
    <div class="admin-content">
      <div class="admin-head">
        <div>
          <span class="eyebrow" data-i18n="admin.products">Products</span>
          <h1 style="font-size:var(--font-size-2xl)" data-i18n="admin.products">สินค้า</h1>
        </div>
        <div class="flex gap-sm">
          <div class="search-wrap" style="min-width:240px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="admin-product-search" class="form-input" placeholder="ค้นหาสินค้า..." data-i18n-placeholder="shop.search">
          </div>
          <button id="admin-add-product-btn" class="btn btn-primary" data-i18n="admin.add_product">+ เพิ่มสินค้า</button>
        </div>
      </div>

      <form id="admin-product-form" class="panel mb-lg hidden reveal">
        <h2 id="admin-product-form-title" data-i18n="admin.new_product">เพิ่มสินค้าใหม่</h2>
        <div class="flex gap-md" style="flex-wrap:wrap">
          <div class="form-group" style="flex:1;min-width:220px">
            <label class="form-label" for="product-name" data-i18n="admin.product_name">ชื่อสินค้า</label>
            <input type="text" id="product-name" class="form-input" required placeholder="ชื่อสินค้า">
          </div>
          <div class="form-group" style="flex:0 1 160px">
            <label class="form-label" for="product-sku">SKU</label>
            <input type="text" id="product-sku" class="form-input" placeholder="C001">
          </div>
          <div class="form-group" style="flex:0 1 200px">
            <label class="form-label" for="product-category" data-i18n="admin.product_category">หมวดหมู่</label>
            <input type="text" id="product-category" class="form-input" placeholder="ชื่อหมวดหมู่">
          </div>
        </div>
        <div class="flex gap-md" style="flex-wrap:wrap">
          <div class="form-group" style="flex:0 1 160px">
            <label class="form-label" for="product-price" data-i18n="admin.product_price">ราคา (บาท)</label>
            <input type="number" id="product-price" class="form-input" min="0" step="1" required placeholder="50">
          </div>
          <div class="form-group" style="flex:0 1 160px">
            <label class="form-label" for="product-stock" data-i18n="admin.product_stock">จำนวนสต็อก</label>
            <input type="number" id="product-stock" class="form-input" min="0" step="1" required placeholder="10">
          </div>
          <div class="form-group" style="flex:1;min-width:240px">
            <label class="form-label" for="product-image" data-i18n="admin.product_image">URL รูปสินค้า</label>
            <input type="url" id="product-image" class="form-input" placeholder="https://...">
            <div class="flex gap-sm mt-sm" style="align-items:center">
              <input type="file" id="product-image-file" accept="image/png,image/jpeg,image/webp" class="hidden">
              <button type="button" id="product-image-upload-btn" class="btn btn-outline btn-sm" data-i18n="admin.product_upload">อัปโหลดรูป</button>
              <span id="product-image-status" class="text-muted text-sm"></span>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="product-description" data-i18n="admin.product_desc">รายละเอียดสินค้า</label>
          <textarea id="product-description" class="form-input" rows="3" placeholder="รายละเอียดสินค้า"></textarea>
        </div>
        <label class="form-checkbox mb-lg">
          <input type="checkbox" id="product-active" checked>
          <span data-i18n="admin.product_active">เปิดขายสินค้านี้</span>
        </label>
        <div class="flex gap-sm">
          <button type="submit" class="btn btn-primary" data-i18n="admin.save_product">บันทึกสินค้า</button>
          <button type="button" id="admin-product-cancel" class="btn btn-ghost" data-i18n="common.cancel">ยกเลิก</button>
        </div>
      </form>

      <div class="table-wrap reveal">
        <table class="data">
          <thead>
            <tr>
              <th data-i18n="admin.product_image">รูป</th>
              <th data-i18n="admin.product_name">ชื่อสินค้า</th>
              <th data-i18n="admin.product_category">หมวดหมู่</th>
              <th class="num" data-i18n="common.price">ราคา</th>
              <th style="text-align:center" data-i18n="admin.product_stock">สต็อก</th>
              <th data-i18n="common.status">สถานะ</th>
              <th data-i18n="common.actions">จัดการ</th>
            </tr>
          </thead>
          <tbody id="admin-products-list"></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
