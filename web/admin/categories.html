<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenMarket | หมวดหมู่</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/spaces.css" />
    <link rel="stylesheet" href="/src/styles/responsive.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/admin/index.js"></script>
    <noscript
      ><style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >
  </head>
  <body>
    <div class="admin-layout">
      <div class="admin-content">
        <div class="admin-head">
          <div>
            <span class="eyebrow" data-i18n="admin.categories">Categories</span>
            <h1 style="font-size: var(--font-size-2xl)" data-i18n="admin.categories">หมวดหมู่</h1>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 320px; gap: var(--space-lg)" class="admin-two-col">
          <div class="panel reveal">
            <h2 data-i18n="admin.all_categories">หมวดหมู่ทั้งหมด</h2>
            <div id="admin-categories-list"></div>
          </div>

          <form id="admin-category-form" class="panel reveal" data-delay="1">
            <h2 data-i18n="admin.add_category">เพิ่มหมวดหมู่</h2>
            <div class="form-group">
              <label class="form-label" for="admin-category-name" data-i18n="admin.product_category">ชื่อหมวดหมู่</label>
              <input type="text" id="admin-category-name" class="form-input" required placeholder="เช่น เครื่องสำอาง" />
            </div>
            <button type="submit" class="btn btn-primary btn-full" data-i18n="admin.add_category">เพิ่มหมวดหมู่</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
