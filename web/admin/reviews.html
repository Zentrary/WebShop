<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รีวิว — ZenMarket Admin</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/admin/index.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <div class="admin-layout">
    <div class="admin-content">
      <div class="admin-head">
        <div>
          <span class="eyebrow">Reviews</span>
          <h1 style="font-size:var(--font-size-2xl)">รีวิว</h1>
        </div>
      </div>

      <div class="table-wrap reveal">
        <table class="data">
          <thead>
            <tr>
              <th>ผู้รีวิว</th>
              <th>สินค้า</th>
              <th style="text-align:center">คะแนน</th>
              <th>ความคิดเห็น</th>
              <th>วันที่</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="admin-reviews-list"></tbody>
        </table>
      </div>

      <div id="admin-reviews-pagination" class="pagination"></div>
    </div>
  </div>
</body>
</html>
