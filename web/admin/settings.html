<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>การตั้งค่า — ZenMarket Admin</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/admin/index.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <div class="admin-layout">
    <div class="admin-content">
      <div class="admin-head">
        <div>
          <span class="eyebrow">Settings</span>
          <h1 style="font-size:var(--font-size-2xl)">การตั้งค่าร้าน</h1>
        </div>
      </div>

      <form id="admin-settings-form" class="panel reveal">
        <h2>ข้อมูลร้าน</h2>
        <div class="form-group">
          <label class="form-label" for="setting-store-name">ชื่อร้าน</label>
          <input type="text" id="setting-store-name" class="form-input" placeholder="ZenMarket">
        </div>
        <div class="form-group">
          <label class="form-label" for="setting-store-logo">URL โลโก้</label>
          <input type="url" id="setting-store-logo" class="form-input" placeholder="https://...">
        </div>
        <div class="form-group">
          <label class="form-label" for="setting-store-description">คำโปรยร้าน</label>
          <input type="text" id="setting-store-description" class="form-input" placeholder="ร้านค้าออนไลน์ด้วยความตั้งใจ">
        </div>

        <h2 class="mt-lg">ช่องทางติดต่อ</h2>
        <div class="flex gap-md" style="flex-wrap:wrap">
          <div class="form-group" style="flex:1;min-width:220px">
            <label class="form-label" for="setting-contact-email">อีเมล</label>
            <input type="email" id="setting-contact-email" class="form-input" placeholder="hello@example.com">
          </div>
          <div class="form-group" style="flex:1;min-width:220px">
            <label class="form-label" for="setting-contact-phone">เบอร์โทรศัพท์</label>
            <input type="tel" id="setting-contact-phone" class="form-input" placeholder="0812345678">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="setting-contact-line">LINE URL</label>
          <input type="url" id="setting-contact-line" class="form-input" placeholder="https://line.me/R/ti/...">
        </div>
        <div class="flex gap-md" style="flex-wrap:wrap">
          <div class="form-group" style="flex:1;min-width:220px">
            <label class="form-label" for="setting-contact-facebook">Facebook URL</label>
            <input type="url" id="setting-contact-facebook" class="form-input" placeholder="https://facebook.com/...">
          </div>
          <div class="form-group" style="flex:1;min-width:220px">
            <label class="form-label" for="setting-contact-instagram">Instagram URL</label>
            <input type="url" id="setting-contact-instagram" class="form-input" placeholder="https://instagram.com/...">
          </div>
        </div>

        <h2 class="mt-lg">การจัดส่ง</h2>
        <div class="flex gap-md" style="flex-wrap:wrap">
          <div class="form-group" style="flex:1;min-width:220px">
            <label class="form-label" for="setting-shipping-fee">ค่าจัดส่ง (บาท)</label>
            <input type="number" id="setting-shipping-fee" class="form-input" min="0" step="1" placeholder="50">
          </div>
          <div class="form-group" style="flex:1;min-width:220px">
            <label class="form-label" for="setting-free-shipping-threshold">ส่งฟรีเมื่อช้อปครบ (บาท)</label>
            <input type="number" id="setting-free-shipping-threshold" class="form-input" min="0" step="1" placeholder="300">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="setting-shipping-note">หมายเหตุการจัดส่ง</label>
          <textarea id="setting-shipping-note" class="form-input" rows="3" placeholder="จัดส่งช่วงเวลา หรือหมายเหตุอื่น ๆ"></textarea>
        </div>

        <h2 class="mt-lg">เกี่ยวกับร้าน</h2>
        <div class="form-group">
          <label class="form-label" for="setting-about">ข้อความแนะนำร้าน</label>
          <textarea id="setting-about" class="form-input" rows="5" placeholder="เขียนเกี่ยวกับร้านของคุณ..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">บันทึกการตั้งค่า</button>
      </form>
    </div>
  </div>
</body>
</html>
