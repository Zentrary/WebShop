<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenMarket | คูปองส่วนลด</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/spaces.css" />
    <link rel="stylesheet" href="/src/styles/responsive.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/admin/index.js"></script>
    <noscript
      ><style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >
  </head>
  <body>
    <div class="admin-layout">
      <div class="admin-content">
        <div class="admin-head">
          <div class="admin-head-text">
            <h1 class="admin-page-title" data-i18n="admin.page_coupons">คูปองส่วนลด</h1>
            <p class="admin-page-sub" data-i18n="admin.coupons_sub">สร้างโค้ดส่วนลดให้ลูกค้าใช้ตอนชำระเงิน</p>
          </div>
          <button type="button" id="admin-coupon-add" class="btn btn-primary" data-i18n="admin.coupon_new">เพิ่มคูปอง</button>
        </div>

        <dialog id="coupon-sheet" class="edit-sheet" aria-labelledby="admin-coupon-form-title">
          <div class="edit-sheet-head">
            <div class="edit-sheet-heading">
              <h2 id="admin-coupon-form-title" class="edit-sheet-title" data-i18n="admin.coupon_new">เพิ่มคูปอง</h2>
              <p id="admin-coupon-form-sub" class="edit-sheet-sub" hidden></p>
            </div>
            <button type="button" id="admin-coupon-close" class="edit-sheet-close" aria-label="ปิด" data-i18n-aria-label="common.close">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M18 6 6 18M6 6l12 12" />
              </svg>
            </button>
          </div>

          <div class="edit-sheet-body">
            <form id="admin-coupon-form" class="edit-sheet-form" novalidate>
              <div class="form-grid">
                <div class="form-group col-2">
                  <label class="form-label" for="coupon-code" data-i18n="admin.coupon_code">โค้ด</label>
                  <input type="text" id="coupon-code" class="form-input" maxlength="32" required placeholder="WELCOME10" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="coupon-kind" data-i18n="admin.coupon_kind">รูปแบบ</label>
                  <select id="coupon-kind" class="form-input">
                    <option value="percent" data-i18n="admin.coupon_percent">เปอร์เซ็นต์ (%)</option>
                    <option value="amount" data-i18n="admin.coupon_amount">จำนวนเงิน (บาท)</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label" for="coupon-value" data-i18n="admin.coupon_value">ส่วนลด</label>
                  <input type="number" id="coupon-value" class="form-input" min="0.01" step="0.01" required placeholder="10" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="coupon-min" data-i18n="admin.coupon_min">ยอดซื้อขั้นต่ำ</label>
                  <input type="number" id="coupon-min" class="form-input" min="0" step="1" placeholder="0" />
                </div>
                <div class="form-group">
                  <label class="form-label" for="coupon-max-uses" data-i18n="admin.coupon_max_uses">ใช้ได้สูงสุด (ครั้ง)</label>
                  <input
                    type="number"
                    id="coupon-max-uses"
                    class="form-input"
                    min="1"
                    step="1"
                    placeholder="ไม่จำกัด"
                    data-i18n-placeholder="admin.coupon_unlimited_ph"
                  />
                </div>
                <div class="form-group">
                  <label class="form-label" for="coupon-ends" data-i18n="admin.coupon_ends">วันหมดอายุ</label>
                  <input type="date" id="coupon-ends" class="form-input" />
                </div>
              </div>
            </form>
          </div>

          <div class="edit-sheet-foot">
            <p id="coupon-form-error" class="sheet-error" role="alert" hidden></p>
            <label class="form-checkbox">
              <input type="checkbox" id="coupon-active" form="admin-coupon-form" checked />
              <span data-i18n="admin.coupon_active">เปิดใช้</span>
            </label>
            <div class="flex gap-sm">
              <button type="submit" form="admin-coupon-form" class="btn btn-primary" data-i18n="common.save">บันทึก</button>
              <button type="button" id="admin-coupon-cancel" class="btn btn-outline" data-i18n="common.cancel">ยกเลิก</button>
            </div>
          </div>
        </dialog>

        <div class="table-wrap reveal">
          <table class="data">
            <thead>
              <tr>
                <th data-i18n="admin.coupon_code">โค้ด</th>
                <th class="num" data-i18n="admin.coupon_value">ส่วนลด</th>
                <th class="num" data-i18n="admin.coupon_min">ยอดซื้อขั้นต่ำ</th>
                <th class="num" data-i18n="admin.coupon_uses">ใช้แล้ว</th>
                <th data-i18n="admin.coupon_ends">วันหมดอายุ</th>
                <th data-i18n="common.status">สถานะ</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="admin-coupons-list"></tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
