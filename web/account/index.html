<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenMarket | บัญชีของฉัน</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/spaces.css" />
    <link rel="stylesheet" href="/src/styles/responsive.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/customer/account.js"></script>
    <noscript
      ><style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >
  </head>
  <body>
    <main class="container page">
      <div class="page-head reveal">
        <span class="eyebrow" data-i18n="nav.account">บัญชีของฉัน</span>
        <h1 class="page-title" data-i18n="account.title">บัญชีของฉัน</h1>
      </div>

      <div class="account-grid">
        <aside class="side-card reveal">
          <div class="avatar" id="account-avatar" aria-hidden="true"></div>
          <div class="font-semibold" id="account-name">ผู้ใช้งาน</div>
          <div class="text-muted text-sm" id="account-email"></div>

          <nav class="side-nav mt-lg">
            <a href="#" class="active" data-tab="profile">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                <circle cx="12" cy="8" r="4" />
                <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1" />
              </svg>
              <span data-i18n="account.profile">โปรไฟล์</span>
            </a>
            <a href="#" data-tab="orders">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
                <path d="M3 6h18" />
              </svg>
              <span data-i18n="account.orders">คำสั่งซื้อ</span>
            </a>
            <a href="#" data-tab="addresses">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
              <span data-i18n="account.addresses">ที่อยู่</span>
            </a>
            <a href="/account/favorites.html">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z" />
              </svg>
              <span data-i18n="account.favorites">รายการโปรด</span>
            </a>
          </nav>
        </aside>

        <div>
          <section id="account-profile" class="panel reveal">
            <h2 data-i18n="account.profile">โปรไฟล์</h2>
            <form id="profile-form">
              <div class="form-group">
                <label class="form-label" for="profile-username" data-i18n="auth.username">ชื่อผู้ใช้</label>
                <input type="text" id="profile-username" class="form-input" placeholder="username" />
              </div>
              <div class="flex gap-md" style="flex-wrap: wrap">
                <div class="form-group" style="flex: 1; min-width: 180px">
                  <label class="form-label" for="profile-firstname" data-i18n="account.firstname_label">ชื่อ</label>
                  <input
                    type="text"
                    id="profile-firstname"
                    class="form-input"
                    placeholder="ชื่อ"
                    data-i18n-placeholder="account.firstname_label"
                  />
                </div>
                <div class="form-group" style="flex: 1; min-width: 180px">
                  <label class="form-label" for="profile-lastname" data-i18n="account.lastname_label">นามสกุล</label>
                  <input
                    type="text"
                    id="profile-lastname"
                    class="form-input"
                    placeholder="นามสกุล"
                    data-i18n-placeholder="account.lastname_label"
                  />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-phone" data-i18n="common.phone">เบอร์โทรศัพท์</label>
                <input
                  type="tel"
                  id="profile-phone"
                  class="form-input"
                  pattern="0?[0-9]{9}"
                  maxlength="10"
                  inputmode="numeric"
                  title="0 ตามด้วยตัวเลข 9 หลัก"
                  data-i18n-title="common.phone_hint"
                  placeholder="0812345678"
                />
              </div>
              <button type="submit" class="btn btn-primary" data-i18n="account.save_profile">บันทึกการเปลี่ยนแปลง</button>
            </form>
          </section>

          <section id="account-orders" class="panel reveal hidden">
            <h2 data-i18n="account.recent_orders">คำสั่งซื้อล่าสุด</h2>
            <div id="customer-orders-list"></div>
            <a href="/account/orders.html" class="btn btn-outline mt-lg" data-i18n="account.view_all_orders">ดูคำสั่งซื้อทั้งหมด</a>
          </section>

          <section id="account-addresses" class="panel reveal hidden">
            <div class="flex justify-between items-center mb-md" style="flex-wrap: wrap; gap: var(--space-sm)">
              <h2 style="margin: 0" data-i18n="account.address_book">สมุดที่อยู่</h2>
              <button id="address-add-btn" type="button" class="btn btn-outline btn-sm" data-i18n="account.add_address">+ เพิ่มที่อยู่</button>
            </div>

            <form id="address-form" class="panel hidden" style="padding: 1rem; margin-bottom: var(--space-lg)">
              <h3
                id="address-form-title"
                style="font-size: var(--font-size-base); margin-bottom: var(--space-sm)"
                data-i18n="account.add_address"
              >
                เพิ่มที่อยู่
              </h3>
              <div class="form-group">
                <label class="form-label" for="address-label" data-i18n="account.address_label">ชื่อเรียกที่อยู่</label>
                <input
                  type="text"
                  id="address-label"
                  class="form-input"
                  placeholder="เช่น บ้าน / ที่ทำงาน"
                  data-i18n-placeholder="account.address_label_ph"
                />
              </div>
              <div class="flex gap-md" style="flex-wrap: wrap">
                <div class="form-group" style="flex: 1; min-width: 180px">
                  <label class="form-label" for="address-recipient" data-i18n="account.address_recipient">ชื่อผู้รับ</label>
                  <input type="text" id="address-recipient" class="form-input" required />
                </div>
                <div class="form-group" style="flex: 1; min-width: 180px">
                  <label class="form-label" for="address-phone" data-i18n="common.phone">เบอร์โทรศัพท์</label>
                  <input
                    type="tel"
                    id="address-phone"
                    class="form-input"
                    required
                    pattern="0?[0-9]{9}"
                    maxlength="10"
                    inputmode="numeric"
                    title="0 ตามด้วยตัวเลข 9 หลัก"
                    data-i18n-title="common.phone_hint"
                  />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="address-address" data-i18n="account.address_address">ที่อยู่จัดส่ง</label>
                <textarea id="address-address" class="form-input" rows="3" required></textarea>
              </div>
              <label class="form-checkbox">
                <input type="checkbox" id="address-default" />
                <span data-i18n="account.set_default">ตั้งเป็นค่าเริ่มต้น</span>
              </label>
              <div class="flex gap-sm mt-md">
                <button type="submit" class="btn btn-primary btn-sm" data-i18n="common.save">บันทึก</button>
                <button type="button" id="address-cancel-btn" class="btn btn-ghost btn-sm" data-i18n="common.cancel">ยกเลิก</button>
              </div>
            </form>

            <div id="addresses-list"></div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
