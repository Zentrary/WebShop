<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บัญชีของฉัน - ZenMarket</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/customer/account.js"></script>
</head>
<body>
  <main class="container pt-lg pb-xl">
    <div class="account-layout grid grid-cols-3 gap-grid-lg">
      <aside class="account-sidebar col-span-1">
        <div class="card p-md">
          <div class="text-center mb-md">
            <img id="account-avatar" src="/public/images/placeholder.svg" alt="avatar" class="w-16 h-16 rounded-full mx-auto mb-sm bg-surface">
            <h3 id="account-name" class="font-semibold">ผู้ใช้งาน</h3>
            <p id="account-email" class="text-secondary text-sm"></p>
          </div>
          <nav class="space-y-sm">
            <a href="#" class="btn btn-outline btn-full text-left py-sm" data-i18n="account.profile">โปรไฟล์</a>
            <a href="#" class="btn btn-outline btn-full text-left py-sm" data-i18n="account.addresses">สมุดที่อยู่</a>
            <a href="#" class="btn btn-outline btn-full text-left py-sm" data-i18n="account.orders">คำสั่งซื้อ</a>
            <a href="#" class="btn btn-outline btn-full text-left py-sm" data-i18n="account.favorites">รายการโปรด</a>
          </nav>
        </div>
      </aside>

      <div class="account-content col-span-2">
        <div id="account-profile" class="account-section">
          <h2 data-i18n="account.profile">โปรไฟล์</h2>
          <form id="profile-form" class="space-y-md">
            <div class="form-group">
              <label class="form-label">ชื่อผู้ใช้</label>
              <input type="text" id="profile-username" class="form-input" readonly>
            </div>
            <div class="form-group">
              <label class="form-label">อีเมล</label>
              <input type="email" id="profile-email" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">เบอร์โทรศัพท์</label>
              <input type="tel" id="profile-phone" class="form-input">
            </div>
            <button type="submit" class="btn btn-primary" data-i18n="common.save">บันทึก</button>
          </form>
        </div>

        <div id="account-addresses" class="account-section hidden">
          <h2 data-i18n="account.addresses">สมุดที่อยู่</h2>
          <div id="addresses-list" class="space-y-sm mb-lg"></div>
          <button id="add-address-btn" class="btn btn-outline btn-full" data-i18n="common.save">เพิ่มที่อยู่</button>
        </div>

        <div id="account-orders" class="account-section hidden">
          <h2 data-i18n="account.orders">คำสั่งซื้อ</h2>
          <div id="customer-orders-list" class="space-y-sm"></div>
        </div>

        <div id="account-favorites" class="account-section hidden">
          <h2 data-i18n="account.favorites">รายการโปรด</h2>
          <div id="favorites-list" class="grid grid-cols-3 gap-grid-md"></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
