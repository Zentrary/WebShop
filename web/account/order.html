<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดคำสั่งซื้อ - ZenMarket</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/customer/checkout.js"></script>
</head>
<body>
  <main class="container pt-lg pb-xl">
    <h1 id="order-title" class="mb-lg">รายละเอียดคำสั่งซื้อ</h1>

    <div id="order-not-found" class="text-center py-xl hidden">
      <div class="text-muted font-medium">ไม่พบคำสั่งซื้อที่ระบุ</div>
    </div>

    <div id="order-detail" class="hidden">
      <div class="grid grid-cols-2 gap-grid-lg mb-xl">
        <div class="order-info">
          <h2 class="font-semibold mb-md">ข้อมูลคำสั่งซื้อ</h2>
          <div class="space-y-sm mb-lg">
            <p><span class="text-secondary">เลขคำสั่งซื้อ:</span> <span id="order-number" class="font-semibold"></span></p>
            <p><span class="text-secondary">วันที่สั่ง:</span> <span id="order-date"></span></p>
            <p><span class="text-secondary">สถานะ:</span> <span id="order-status" class="badge badge-info"></span></p>
            <p><span class="text-secondary">วิธีชำระ:</span> <span id="order-payment"></span></p>
          </div>

          <h3 class="font-semibold mb-sm">ที่อยู่จัดส่ง</h3>
          <div id="order-shipping-address" class="text-secondary mb-lg"></div>
        </div>

        <div class="order-summary">
          <h2 class="font-semibold mb-md">สรุปยอดเงิน</h2>
          <div class="space-y-sm mb-lg">
            <div class="flex justify-between">
              <span>ยอดรวมสินค้า</span>
              <span id="order-subtotal" class="font-semibold">฿0.00</span>
            </div>
            <div class="flex justify-between">
              <span>ค่าจัดส่ง</span>
              <span id="order-shipping" class="font-semibold">฿0.00</span>
            </div>
            <div class="flex justify-between border-t pt-md">
              <span class="font-bold">รวมทั้งหมด</span>
              <span id="order-total" class="font-bold text-primary">฿0.00</span>
            </div>
          </div>
        </div>
      </div>

      <div class="timeline mb-xl">
        <h2 class="font-semibold mb-md">ไทม์ไลน์คำสั่งซื้อ</h2>
        <div id="order-timeline" class="relative pl-md border-l border-border">
          <!-- Timeline steps loaded via JavaScript -->
        </div>
      </div>

      <div class="order-items mb-xl">
        <h2 class="font-semibold mb-md">สินค้าในคำสั่งซื้อ</h2>
        <div id="order-items-list" class="grid grid-cols-4 gap-grid-md">
          <!-- Order items loaded via JavaScript -->
        </div>
      </div>

      <div id="order-receipt-section" class="mb-xl">
        <h2 class="font-semibold mb-md">สลิปการโอนเงิน</h2>
        <div id="receipt-upload" class="border rounded-lg p-md text-center">
          <p class="text-secondary">ยังไม่มีสลิปการโอนเงิน</p>
          <button id="upload-receipt-btn" class="btn btn-outline mt-sm">อัปโหลดสลิป</button>
        </div>
        <div id="receipt-image" class="hidden mt-md">
          <img id="receipt-preview" src="" alt="สลิป" class="max-w-full max-h-96 mx-auto rounded-md border">
        </div>
      </div>

      <div id="order-review-section" class="mb-xl">
        <h2 class="font-semibold mb-md">รีวิวสินค้า</h2>
        <div id="review-form" class="card p-lg">
          <!-- Review form loaded via JavaScript -->
        </div>
      </div>
    </div>
  </main>
</body>
</html>
