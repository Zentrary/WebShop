<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenMarket | รายละเอียดสินค้า</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/storefront/store.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <main class="container page">
    <nav class="text-muted text-sm mb-lg" style="font-size:var(--font-size-sm)">
      <a href="/home.html" class="hover:text-primary" data-i18n="nav.home">หน้าแรก</a> /
      <a href="/shop/index.html" class="hover:text-primary" data-i18n="nav.shop">ร้านค้า</a> /
      <span class="text-primary" data-i18n="product.detail_eyebrow">รายละเอียดสินค้า</span>
    </nav>

    <div class="pd-grid">
      <div class="pd-gallery reveal">
        <div class="main">
          <img src="/images/placeholder.svg" alt="สินค้า" id="main-product-img">
        </div>
        <div class="pd-thumbs" id="thumbnail-list"></div>
      </div>

      <div class="pd-info reveal" data-delay="1">
        <span class="eyebrow" id="product-cat"></span>
        <h1 id="product-title">กำลังโหลด...</h1>
        <div class="pd-price" id="product-price">—</div>
        <div id="product-stock" class="mb-md"></div>
        <p id="product-description" class="mb-lg"></p>

        <div class="flex gap-md items-center mb-lg">
          <div class="qty-ctl">
            <button id="qty-decrease" type="button" aria-label="ลดจำนวน" data-i18n-aria-label="common.decrease">−</button>
            <input type="number" id="qty-input" value="1" min="1" aria-label="จำนวน" data-i18n-aria-label="common.quantity">
            <button id="qty-increase" type="button" aria-label="เพิ่มจำนวน" data-i18n-aria-label="common.increase">+</button>
          </div>
        </div>

        <div class="flex gap-sm items-center" style="flex-wrap:wrap">
          <button id="add-to-cart-btn" class="btn btn-primary btn-lg" data-i18n="product.add_to_cart">เพิ่มลงตะกร้า</button>
          <button id="buy-now-btn" class="btn btn-outline btn-lg" data-i18n="product.buy_now">สั่งซื้อเลย</button>
          <button id="product-favorite-btn" class="btn btn-ghost btn-lg" data-favorite-toggle="product.favorite_add">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21.2l7.7-7.8 1.1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>
            <span id="product-favorite-label">เพิ่มในรายการโปรด</span>
          </button>
        </div>

        <hr class="divider">

        <div class="flex gap-md items-center text-sm text-secondary" style="flex-wrap:wrap">
          <span data-i18n="product.info_payment">• ชำระเงินผ่านพร้อมเพย์ (PromptPay)</span>
          <span data-i18n="product.info_shipping">• จัดส่งภายใน 2–5 วันทำการ</span>
        </div>
      </div>
    </div>

    <hr class="divider">

    <section>
      <span class="eyebrow" data-i18n="product.reviews_eyebrow">Reviews</span>
      <h2 style="margin-bottom:var(--space-lg)" data-i18n="product.reviews_title">รีวิวสินค้า</h2>
      <div id="reviews-list" class="review-grid"></div>
    </section>

    <hr class="divider">

    <section>
      <span class="eyebrow" data-i18n="nav.shop">รายการสินค้า</span>
      <h2 style="margin-bottom:var(--space-lg)" data-i18n="product.related_title">สินค้าที่เกี่ยวข้อง</h2>
      <div id="related-grid" class="product-grid"></div>
    </section>
  </main>
</body>
</html>
