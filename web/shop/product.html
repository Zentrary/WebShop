<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายละเอียดสินค้า — ZenMarket</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/storefront/store.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <main class="container page">
    <nav class="text-muted text-sm mb-lg" style="font-size:var(--font-size-sm)">
      <a href="/home.html" class="hover:text-primary">หน้าแรก</a> /
      <a href="/shop/index.html" class="hover:text-primary">ร้านค้า</a> /
      <span class="text-primary">รายละเอียดสินค้า</span>
    </nav>

    <div class="pd-grid">
      <div class="pd-gallery reveal">
        <div class="main">
          <img src="/images/placeholder.svg" alt="สินค้า" id="main-product-img">
        </div>
        <div class="pd-thumbs" id="thumbnail-list"></div>
      </div>

      <div class="pd-info reveal" data-delay="1">
        <span class="eyebrow" id="product-cat"></span>
        <h1 id="product-title">กำลังโหลด...</h1>
        <div class="pd-price" id="product-price">—</div>
        <div id="product-stock" class="mb-md"></div>
        <p id="product-description" class="mb-lg"></p>

        <div class="flex gap-md items-center mb-lg">
          <div class="qty-ctl">
            <button id="qty-decrease" type="button" aria-label="ลดจำนวน">−</button>
            <input type="number" id="qty-input" value="1" min="1" aria-label="จำนวน">
            <button id="qty-increase" type="button" aria-label="เพิ่มจำนวน">+</button>
          </div>
        </div>

        <div class="flex gap-sm" style="flex-wrap:wrap">
          <button id="add-to-cart-btn" class="btn btn-primary btn-lg">เพิ่มลงตะกร้า</button>
          <button id="buy-now-btn" class="btn btn-outline btn-lg">สั่งซื้อเลย</button>
        </div>

        <hr class="divider">

        <div class="flex gap-md items-center text-sm text-secondary" style="flex-wrap:wrap">
          <span>• ชำระเงินผ่านพร้อมเพย์ (PromptPay)</span>
          <span>• จัดส่งภายใน 2–5 วันทำการ</span>
        </div>
      </div>
    </div>

    <hr class="divider">

    <section>
      <span class="eyebrow">Reviews</span>
      <h2 style="margin-bottom:var(--space-lg)">รีวิวสินค้า</h2>
      <div id="reviews-list" class="review-grid"></div>
    </section>

    <hr class="divider">

    <section>
      <span class="eyebrow">Related</span>
      <h2 style="margin-bottom:var(--space-lg)">สินค้าที่เกี่ยวข้อง</h2>
      <div id="related-grid" class="product-grid"></div>
    </section>
  </main>
</body>
</html>
