<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ร้านค้า - ZenMarket</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/storefront/store.js"></script>
</head>
<body>
  <main class="container pt-lg pb-xl">
    <div class="flex justify-between items-center mb-lg">
      <h1 data-i18n="nav.shop">ร้านค้า</h1>
      <div class="flex gap-sm">
        <input type="text" id="product-search" class="form-input w-64" placeholder="ค้นหาสินค้า...">
        <select id="category-filter" class="form-select w-64">
          <option value="">ทุกหมวดหมู่</option>
        </select>
      </div>
    </div>

    <div id="product-count" class="text-secondary mb-md"></div>

    <div id="product-grid" class="grid grid-cols-4 gap-grid-lg">
      <!-- Products loaded via JavaScript -->
    </div>

    <div id="pagination" class="flex justify-center gap-sm mt-lg"></div>
  </main>
</body>
</html>
