<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenMarket | รายการสินค้า</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/spaces.css" />
    <link rel="stylesheet" href="/src/styles/responsive.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/storefront/store.js"></script>
    <noscript
      ><style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >
  </head>
  <body>
    <main class="container page">
      <div id="shop-gate" class="hidden"></div>

      <div id="shop-content">
        <div class="page-head reveal">
          <h1 class="page-title" data-i18n="shop.title">รายการสินค้า</h1>
          <p class="page-sub" data-i18n="shop.sub">สินค้าทั้งหมดของร้าน คัดสรรด้วยความใส่ใจ</p>
        </div>

        <section class="shop-filters reveal" id="shop-filters" data-delay="1">
          <div class="shop-filter-bar">
            <div class="search-wrap shop-search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input type="text" id="product-search" class="form-input" placeholder="ค้นหาสินค้า..." data-i18n-placeholder="shop.search" />
            </div>

            <div class="shop-filter-controls">
              <div class="filter-dropdown">
                <button type="button" id="category-toggle" class="filter-btn" aria-expanded="false" aria-controls="category-panel">
                  <svg
                    class="filter-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M20.59 13.41 13.42 20.6a2 2 0 0 1-2.83 0L2 12V4a2 2 0 0 1 2-2h8l8.59 8.59a2 2 0 0 1 0 2.82Z" />
                    <circle cx="7" cy="7" r="1.2" />
                  </svg>
                  <span class="filter-btn-text">
                    <span class="filter-caption" data-i18n="shop.filter_category">หมวดหมู่</span>
                    <span class="filter-value" id="category-current">ทุกหมวดหมู่</span>
                  </span>
                  <svg
                    class="filter-chev"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </button>

                <div id="category-panel" class="filter-panel" hidden>
                  <div class="filter-panel-search">
                    <input
                      type="search"
                      id="category-search"
                      class="form-input"
                      placeholder="ค้นหาหมวดหมู่"
                      data-i18n-placeholder="shop.category_search"
                      autocomplete="off"
                    />
                  </div>
                  <div class="category-chips" id="category-chips" role="listbox" aria-label="หมวดหมู่สินค้า"></div>
                  <p class="filter-panel-empty text-muted text-sm" id="category-empty" hidden data-i18n="shop.category_no_match">
                    ไม่พบหมวดหมู่ที่ค้นหา
                  </p>
                  <p class="filter-panel-foot text-muted text-sm" id="category-count"></p>
                </div>
              </div>

              <div class="filter-btn filter-btn-select">
                <span class="filter-caption" data-i18n="shop.sort_label">เรียงตาม</span>
                <span class="filter-value" id="sort-current" aria-hidden="true">ใหม่ล่าสุด</span>
                <select id="sort-select" class="filter-select" aria-label="เรียงลำดับสินค้า">
                  <option value="newest" data-i18n="shop.sort_newest">ใหม่ล่าสุด</option>
                  <option value="price_asc" data-i18n="shop.sort_price_asc">ราคา: ต่ำ → สูง</option>
                  <option value="price_desc" data-i18n="shop.sort_price_desc">ราคา: สูง → ต่ำ</option>
                </select>
                <svg
                  class="filter-chev"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m6 9 6 6 6-6" />
                </svg>
              </div>

              <button type="button" id="promo-toggle" class="filter-chip" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 9h6v6H9z" />
                  <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
                </svg>
                <span data-i18n="shop.filter_promo">เฉพาะลดราคา</span>
              </button>

              <button type="button" id="filter-reset" class="filter-reset" hidden>
                <span data-i18n="shop.filter_reset">ล้างตัวกรอง</span>
              </button>
            </div>
          </div>
        </section>

        <div id="product-count" class="text-muted mb-md" style="font-size: var(--font-size-sm)"></div>

        <div id="product-grid" class="product-grid"></div>

        <div id="pagination" class="pagination"></div>
      </div>
    </main>
  </body>
</html>
