<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenMarket | รายการสินค้า</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/storefront/store.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <main class="container page">
    <div class="page-head reveal">
      <span class="eyebrow" data-i18n="shop.eyebrow">รายการสินค้า</span>
      <h1 class="page-title" data-i18n="shop.title">รายการสินค้า</h1>
      <p class="page-sub" data-i18n="shop.sub">สินค้าทั้งหมดของร้าน คัดสรรด้วยความใส่ใจ</p>
    </div>

    <div class="shop-toolbar reveal" data-delay="1">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="product-search" class="form-input" placeholder="ค้นหาสินค้า..." data-i18n-placeholder="shop.search">
      </div>
      <select id="category-filter" class="form-select">
        <option value="" data-i18n="shop.filter_all">ทุกหมวดหมู่</option>
      </select>
    </div>

    <div id="product-count" class="text-muted mb-md" style="font-size:var(--font-size-sm)"></div>

    <div id="product-grid" class="product-grid"></div>

    <div id="pagination" class="pagination"></div>
  </main>
</body>
</html>
