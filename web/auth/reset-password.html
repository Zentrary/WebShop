<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenMarket | ตั้งรหัสผ่านใหม่</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/customer/account.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card reveal">
      <div class="auth-head">
        <div class="mark">Z</div>
        <h1 style="font-size:var(--font-size-2xl)" data-i18n="auth.reset_title">ตั้งรหัสผ่านใหม่</h1>
        <p class="text-sm mt-sm" data-i18n="auth.reset_sub">กรอกรหัสผ่านใหม่เพื่อเข้าใช้งานบัญชี</p>
      </div>

      <form id="reset-password-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reset-password" data-i18n="auth.password">รหัสผ่าน</label>
          <input type="password" id="reset-password" class="form-input" required minlength="6" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร" data-i18n-placeholder="auth.password_ph">
        </div>

        <div class="form-group">
          <label class="form-label" for="reset-confirm-password" data-i18n="auth.password2">ยืนยันรหัสผ่าน</label>
          <input type="password" id="reset-confirm-password" class="form-input" required minlength="6" autocomplete="new-password" placeholder="••••••••" data-i18n-placeholder="auth.password2_ph">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" data-i18n="auth.submit_reset">บันทึกรหัสผ่าน</button>
      </form>

      <p class="auth-switch"><a href="/auth/login.html" data-i18n="auth.back_login">กลับไปหน้าเข้าสู่ระบบ</a></p>
    </div>
  </main>
</body>
</html>
