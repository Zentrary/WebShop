<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — ZenMarket</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/customer/account.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card reveal">
      <div class="auth-head">
        <div class="mark">Z</div>
        <h1 style="font-size:var(--font-size-2xl)">เข้าสู่ระบบ</h1>
        <p class="text-sm mt-sm">ยินดีต้อนรับกลับสู่ ZenMarket</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-identifier">ชื่อผู้ใช้ หรือ email</label>
          <input type="text" id="login-identifier" class="form-input" required autocomplete="username" placeholder="username หรือ email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">รหัสผ่าน</label>
          <input type="password" id="login-password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
        </div>

        <div class="flex items-center justify-between mb-lg">
          <label class="form-checkbox">
            <input type="checkbox" id="remember-me" checked>
            <span>จดจำฉัน</span>
          </label>
          <a href="/auth/reset-password.html" style="font-size:var(--font-size-sm);color:var(--color-accent)">ลืมรหัสผ่าน?</a>
        </div>

        <div id="turnstile-container" class="mb-md" style="display:none"></div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">เข้าสู่ระบบ</button>
      </form>

      <p class="auth-switch">ยังไม่มีบัญชี? <a href="/auth/register.html">สมัครสมาชิก</a></p>
    </div>
  </main>
</body>
</html>
