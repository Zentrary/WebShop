<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก — ZenMarket</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/customer/account.js"></script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card reveal">
      <div class="auth-head">
        <div class="mark">Z</div>
        <h1 style="font-size:var(--font-size-2xl)">สมัครสมาชิก</h1>
        <p class="text-sm mt-sm">สร้างบัญชีเพื่อสั่งซื้อและติดตามคำสั่งซื้อ</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="register-username">ชื่อผู้ใช้</label>
          <input type="text" id="register-username" class="form-input" required autocomplete="username" placeholder="ตัวอักษรอังกฤษ ตัวเลข _">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-email">อีเมล</label>
          <input type="email" id="register-email" class="form-input" required autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-phone">เบอร์โทรศัพท์</label>
          <input type="tel" id="register-phone" class="form-input" required pattern="[0-9]{9,10}" placeholder="0812345678">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-password">รหัสผ่าน</label>
          <input type="password" id="register-password" class="form-input" required minlength="6" autocomplete="new-password" placeholder="อย่างน้อย 6 ตัวอักษร">
        </div>

        <div class="form-group">
          <label class="form-label" for="register-confirm-password">ยืนยันรหัสผ่าน</label>
          <input type="password" id="register-confirm-password" class="form-input" required minlength="6" autocomplete="new-password" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">สมัครสมาชิก</button>
      </form>

      <p class="auth-switch">มีบัญชีอยู่แล้ว? <a href="/auth/login.html">เข้าสู่ระบบ</a></p>
    </div>
  </main>
</body>
</html>
