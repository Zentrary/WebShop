<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - ZenMarket</title>
  <link rel="stylesheet" href="/src/styles/base.css">
  <link rel="stylesheet" href="/src/styles/spaces.css">
  <link rel="stylesheet" href="/src/styles/responsive.css">
  <link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
  <script type="module" src="/src/pages/customer/account.js"></script>
</head>
<body>
  <main class="container pt-lg pb-xl">
    <div class="auth-card card p-lg mx-auto w-full sm:w-96">
      <div class="text-center mb-xl">
        <div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center mx-auto mb-md">
          <span class="text-white font-bold text-lg">Z</span>
        </div>
        <h2 data-i18n="nav.register">สมัครสมาชิก</h2>
        <p class="text-secondary text-sm">สร้างบัญชีใหม่เพื่อเริ่มต้นซื้อสินค้า</p>
      </div>

      <form id="register-form" class="space-y-md">
        <div class="form-group">
          <label class="form-label">ชื่อผู้ใช้</label>
          <input type="text" id="register-username" class="form-input" required placeholder="ชื่อผู้ใช้">
        </div>
        <div class="form-group">
          <label class="form-label">อีเมล</label>
          <input type="email" id="register-email" class="form-input" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">เบอร์โทรศัพท์</label>
          <input type="tel" id="register-phone" class="form-input" placeholder="0812345678">
        </div>
        <div class="form-group">
          <label class="form-label">รหัสผ่าน</label>
          <input type="password" id="register-password" class="form-input" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">ยืนยันรหัสผ่าน</label>
          <input type="password" id="register-confirm-password" class="form-input" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-full" data-i18n="nav.register">สมัครสมาชิก</button>
      </form>

      <div class="text-center mt-lg">
        <p class="text-secondary text-sm">มีบัญชีอยู่แล้ว?</p>
        <a href="/auth/login.html" class="btn btn-outline btn-full" data-i18n="nav.login">เข้าสู่ระบบ</a>
      </div>
    </div>
  </main>
</body>
</html>
