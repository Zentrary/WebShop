<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenMarket | ลืมรหัสผ่าน</title>
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/spaces.css" />
    <link rel="stylesheet" href="/src/styles/responsive.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/pages/customer/account.js"></script>
    <noscript
      ><style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
      </style></noscript
    >
  </head>
  <body>
    <main class="container page">
      <div class="auth-wrap">
        <section class="panel auth-card reveal">
          <header class="auth-head">
            <span class="eyebrow" data-i18n="auth.area_label">บัญชีสมาชิก</span>
            <h1 class="auth-title" data-i18n="auth.forgot_title">ลืมรหัสผ่าน</h1>
            <p class="auth-sub" data-i18n="auth.forgot_sub">กรอกอีเมลที่ใช้สมัคร ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ให้</p>
          </header>

          <form id="forgot-password-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="forgot-email" data-i18n="auth.email">อีเมล</label>
              <input
                type="email"
                id="forgot-email"
                class="form-input"
                required
                autocomplete="email"
                placeholder="you@example.com"
                data-i18n-placeholder="auth.email_ph"
              />
            </div>

            <button type="submit" class="btn btn-primary btn-full" data-i18n="auth.forgot_submit">ส่งลิงก์ตั้งรหัสผ่าน</button>
          </form>

          <p class="auth-switch">
            <a href="/auth/login.html" data-i18n="auth.back_login">กลับไปหน้าเข้าสู่ระบบ</a>
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
