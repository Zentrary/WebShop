name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://webshop-tau-ebon.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Undefined variable scan
        run: npm run lint:undef
      - name: Prettier check
        run: npm run format:check
      - name: Build
        run: npm run build
